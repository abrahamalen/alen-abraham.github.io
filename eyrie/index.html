    <script>
      // Before first paint, so there's no light flash: a saved choice wins, else the OS.
      ;(function () {
        // ?theme=light|dark forces one for this visit (handy for screenshots and links).
        var saved = new URLSearchParams(location.search).get('theme')
        if (saved !== 'light' && saved !== 'dark') saved = null
        try {
          saved = saved || localStorage.getItem('eyrie-landing-theme')
        } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
