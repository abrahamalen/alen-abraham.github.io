{% extends "base.html" %}
{% block main %}
<header class="page-header">
  <h1>{{ page.title }}</h1>
</header>
<div id="searchbox">
  <input id="searchInput" type="search" placeholder="Search posts and dailies ↵" aria-label="search" autocomplete="off" autofocus>
  <p id="searchStatus" class="search-status" role="status"></p>
  <ul id="searchResults" aria-label="search results"></ul>
</div>
<noscript><p>Search needs JavaScript. The <a href="/archives/">archives</a> list every post.</p></noscript>
<script src="/js/search.js" defer></script>
{% endblock %}
