<article class="{{ entry_class }}">
  <header class="entry-header">
    <h2 class="entry-hint-parent">{{ p.title }}</h2>
  </header>
  <div class="entry-content">
    <p>{{ p.summary }}{% if p.truncated %}...{% endif %}</p>
  </div>
  <footer class="entry-footer"><span title="{{ p.date | iso }}">{{ p.date | date }}</span></footer>
  <a class="entry-link" aria-label="post link to {{ p.title }}" href="{{ p.url }}"></a>
</article>
