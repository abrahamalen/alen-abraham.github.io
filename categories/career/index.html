<script>
  (function () {
    // ?theme=light|dark wins (handy for screenshots), then the saved toggle, then the OS setting.
    // Runs before the first paint, so there's no flash of the other theme.
    var saved = null;
    try { saved = localStorage.getItem("pref-theme"); } catch (e) {}
    var forced = new URLSearchParams(location.search).get("theme") || saved;
    var os = window.matchMedia("(prefers-color-scheme: light)");
    var apply = function (pref) { document.body.classList.toggle("dark", pref !== "light"); };
    apply(forced || (os.matches ? "light" : "dark"));
    // With no saved choice, follow the OS when it switches (e.g. at sunset).
    if (!forced && os.addEventListener) os.addEventListener("change", function (e) {
      try { if (localStorage.getItem("pref-theme")) return; } catch (err) {}
      apply(e.matches ? "light" : "dark");
    });
  })();
</script>

<script>
  var menu = document.getElementById("menu");
  if (menu) {
    menu.scrollLeft = localStorage.getItem("menu-scroll-position");
    menu.onscroll = function () { localStorage.setItem("menu-scroll-position", menu.scrollLeft); };
  }
  document.querySelectorAll('a[href^="#"]').forEach(function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      var id = this.getAttribute("href").substr(1);
      var el = document.querySelector("[id='" + decodeURIComponent(id) + "']");
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      el.scrollIntoView(reduce ? undefined : { behavior: "smooth" });
      if (id === "top") history.replaceState(null, null, " ");
      else history.pushState(null, null, "#" + id);
    });
  });
  var topLink = document.getElementById("top-link");
  if (topLink) window.onscroll = function () {
    var on = document.body.scrollTop > 800 || document.documentElement.scrollTop > 800;
    topLink.style.visibility = on ? "visible" : "hidden";
    topLink.style.opacity = on ? "1" : "0";
  };
  var themeToggle = document.getElementById("theme-toggle");
  if (themeToggle) themeToggle.addEventListener("click", function () {
    var dark = document.body.classList.toggle("dark");
    try { localStorage.setItem("pref-theme", dark ? "dark" : "light"); } catch (e) {}
  });
</script>
