name: Build and Publish Website

on:
  push:
    branches:
      - hugo
  pull_request:
    branches:
      - hugo
      - revamp
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    name: Build and Publish Website
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: lastmod dates come from git

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: make build

      - name: URL parity check
        run: make check

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/hugo' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
