name: Build and Publish Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish:
    # Pinned: ubuntu-latest moves to new releases on its own schedule.
    runs-on: ubuntu-24.04
    name: Build and Publish Website
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: lastmod dates come from git

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Build
        run: make build

      - name: URL parity check
        run: make check

      - name: Config toggle tests
        run: make test

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
